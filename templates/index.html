
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #202224;
            color: #eeeeee;
            font-family: Arial, sans-serif;
        }

        .calculator {
            width: 100%;
            max-width: 700px;
            margin: auto;
            background: #252729;
            border: 1px solid #484b4e;
        }

        .display-area {
            height: 135px;
            background: #1b1d1f;
            border-bottom: 1px solid #484b4e;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            overflow-wrap: anywhere;
        }

        .equation {
            color: #999;
            font-size: 14px;
            margin-bottom: 5px;
            min-height: 18px;
        }

        .display {
            font-size: 28px;
            color: white;
        }

        .keypad {
            padding: 15px;
            display: grid;
            grid-template-columns: repeat(3, 1fr) 1fr 2fr;
            grid-template-rows: repeat(5, 54px);
            gap: 6px;
        }

        button {
            background: #303336;
            color: #eeeeee;
            border: 1px solid #55585b;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            background: #3b3e41;
        }

        button:active {
            background: #484b4e;
        }

        .clear {
            grid-column: 5;
            grid-row: 1;
        }

        .backspace {
            grid-column: 5;
            grid-row: 2 / 4;
        }

        .plus {
            grid-column: 4;
            grid-row: 2 / 4;
        }

        .equal {
            grid-column: 4;
            grid-row: 4 / 6;
        }

        .zero {
            grid-column: 1 / 3;
        }

        .history {
            border-top: 1px solid #484b4e;
            padding: 12px 16px;
            color: #aaaaaa;
            font-size: 12px;
            min-height: 55px;
        }

        .history h3 {
            font-size: 13px;
            font-weight: normal;
            margin: 0 0 8px;
        }

        .history p {
            margin: 5px 0;
        }

        .error {
            padding: 8px 15px;
            color: #ff7373;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="calculator">

    <!-- Calculator display -->
    <div class="display-area">

        <div class="equation">
            {{ equation }}
        </div>

        <div class="display" id="display">
            {{ expression }}
        </div>

    </div>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <!-- Calculator buttons -->
    <form method="POST" id="calculator-form">

        <input type="hidden"
               name="expression"
               id="expression"
               value="{{ expression }}">

        <input type="hidden"
               name="done"
               id="done"
               value="{{ '1' if done else '0' }}">

        <input type="hidden"
               name="key"
               id="key">

        <div class="keypad">

            <button type="submit" name="key" value="÷">÷</button>
            <button type="submit" name="key" value="×">×</button>
            <button type="submit" name="key" value="-">−</button>

            <button type="submit" name="key" value="C"
                    class="clear">C</button>

            <button type="submit" name="key" value="7">7</button>
            <button type="submit" name="key" value="8">8</button>
            <button type="submit" name="key" value="9">9</button>

            <button type="submit" name="key" value="+"
                    class="plus">+</button>

            <button type="submit" name="key" value="⌫"
                    class="backspace">⌫</button>

            <button type="submit" name="key" value="4">4</button>
            <button type="submit" name="key" value="5">5</button>
            <button type="submit" name="key" value="6">6</button>

            <button type="submit" name="key" value="1">1</button>
            <button type="submit" name="key" value="2">2</button>
            <button type="submit" name="key" value="3">3</button>

            <button type="submit" name="key" value="="
                    class="equal">=</button>

            <button type="submit" name="key" value="0"
                    class="zero">0</button>

            <button type="submit" name="key" value=".">.</button>

        </div>
    </form>

    <!-- Calculation history -->
    <div class="history">

        <h3>Calculation History</h3>

        {% for item in history %}
            <p>{{ item }}</p>
        {% else %}
            <p>No calculations yet.</p>
        {% endfor %}

    </div>

</div>

<!-- Keyboard interaction -->
<script>
    const form = document.getElementById("calculator-form");
    const keyInput = document.getElementById("key");

    document.addEventListener("keydown", function(event) {

        const key = event.key;

        if (
            /^[0-9]$/.test(key) ||
            ["+", "-", "*", "/", ".", "Enter",
             "Backspace", "Escape"].includes(key)
        ) {

            event.preventDefault();

            if (/^[0-9]$/.test(key)) {
                keyInput.value = key;
            }
            else if (key === "*") {
                keyInput.value = "×";
            }
            else if (key === "/") {
                keyInput.value = "÷";
            }
            else if (key === "Enter") {
                keyInput.value = "=";
            }
            else if (key === "Backspace") {
                keyInput.value = "⌫";
            }
            else if (key === "Escape") {
                keyInput.value = "C";
            }
            else {
                keyInput.value = key;
            }

            form.requestSubmit();
        }
    });
</script>

</body>
</html>
